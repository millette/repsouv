# Licences des fichiers qui ne peuvent pas porter d'en-tête SPDX (spécification REUSE, https://reuse.software/).
# Les fichiers .ts portent leurs propres en-têtes; chaque schéma déclare aussi sa licence dans « $comment ».
# Vérification: `nub run licences` (uvx reuse lint). Textes des licences: LICENSES/.
version = 1

# Code, schémas JSON, configuration et documentation du dépôt, dont les artefacts Spec Kit de chaque fonctionnalité (specs/), conservés après elle.
[[annotations]]
path = ["schemas/**", "README.md", "implementation.md", "historique.md", "tickets/**", "specs/**","package.json", "nub.lock", "skills-lock.json", "tsconfig.json", "tsconfig.schemas.json", ".gitignore", ".env.example", ".node-version"]
SPDX-FileCopyrightText = "2026 Robin Millette <https://robin.millette.info/>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Données, adaptées du répertoire d'origine (Praxis), des Services FACiLes et des données de l'extension Charles (MIT), et ce qui en est dérivé: sommaire et graphiques.
[[annotations]]
path = ["outils.json", "categories.json", "criteres.json", "tags.json", "sources.json", "sommaire.md", "graphiques/**"]
SPDX-FileCopyrightText = [
  "2026 Sven Buridans, François Delnooz, Marie-Renee Duguay (Praxis), Répertoire d'outils favorisant la souveraineté numérique",
  "2026 Yanis Kerdjana et les contributeurs de Charles <https://gitlab.com/yaniskerdjana/charles> (données de l'extension, MIT)",
  "2026 Robin Millette <https://robin.millette.info/>",
]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Banc d'essai des modèles (analyse-effort/): le script porte son en-tête; l'analyse est de la documentation, les résultats
# JSON (outils enrichis par chaque variante) sont dérivés des données.
[[annotations]]
path = ["analyse-effort/analyse.md"]
SPDX-FileCopyrightText = "2026 Robin Millette <https://robin.millette.info/>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["analyse-effort/*.json"]
SPDX-FileCopyrightText = [
  "2026 Sven Buridans, François Delnooz, Marie-Renee Duguay (Praxis), Répertoire d'outils favorisant la souveraineté numérique",
  "2026 Robin Millette <https://robin.millette.info/>",
]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Skills et outils d'agents installés dans le dépôt, copiés tels quels depuis leurs dépôts d'origine (tous sous MIT):
# charting-vega-lite (Oskar Austegard), astro (Ian Callaghan, ianshk/astro-skills), daisyui (Pouya Saadeghi, saadeghi/daisyui),
# les commandes speckit-* et le dossier .specify/ (GitHub Spec Kit, github/spec-kit). .claude/skills/astro et daisyui sont des
# liens symboliques vers .agents/skills/.
[[annotations]]
path = [".claude/skills/charting-vega-lite/**"]
SPDX-FileCopyrightText = "2025 Oskar Austegard <https://github.com/oaustegard/claude-skills>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [".agents/skills/astro/**", ".claude/skills/astro/**"]
SPDX-FileCopyrightText = "2026 Ian Callaghan <https://github.com/ianshk/astro-skills>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [".agents/skills/daisyui/**", ".claude/skills/daisyui/**"]
SPDX-FileCopyrightText = "2026 Pouya Saadeghi <https://github.com/saadeghi/daisyui>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [".claude/skills/speckit-*/**", ".specify/**"]
SPDX-FileCopyrightText = "2026 GitHub, Inc. <https://github.com/github/spec-kit>"
SPDX-License-Identifier = "MIT"

# Skill solidjs: copie de projet du skill personnel de l'auteur, adaptée aux conventions du dépôt (nub, îles Astro statiques).
[[annotations]]
path = [".claude/skills/solidjs/**"]
SPDX-FileCopyrightText = "2026 Robin Millette <https://robin.millette.info/>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Site de consultation (site/): ses fichiers .ts, .tsx, .mjs, .css et .astro portent leurs en-têtes; ceux-ci ne le peuvent pas.
[[annotations]]
path = ["site/package.json", "site/nub.lock", "site/tsconfig.json", "site/.gitignore", "site/README.md", "site/test/fixtures/**"]
SPDX-FileCopyrightText = "2026 Robin Millette <https://robin.millette.info/>"
SPDX-License-Identifier = "AGPL-3.0-or-later"
