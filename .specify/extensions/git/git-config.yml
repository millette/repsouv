# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Optional branch name template. Leave empty for the default "{number}-{slug}".
# Supported tokens: {author}, {app}, {number}, {slug}
# {slug} must not appear before {number}; final path segment must start with {number}-.
# Example for monorepos: "{author}/{app}/{number}-{slug}"
branch_template: ""

# Optional shorthand namespace. Leave empty to use branch_template/default behavior.
# Example: "features/{app}" expands to "features/{app}/{number}-{slug}"
branch_prefix: ""

# Commit message used by `git commit` during repository initialization
init_commit_message: "Dépôt initialisé par Spec Kit, pour versionner les spécifications dès le départ"

# Commit message style used by auto-commit hooks (speckit.git.commit):
# "fixed"        - default; use the configured/static messages below.
# "conventional" - ask the agent to inspect the diff and generate a
#                  Conventional Commit message (e.g. "feat: add OAuth spec")
#                  instead of using the messages configured below.
commit_style: fixed

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: false
  before_clarify:
    enabled: true
    message: "Spec Kit: état du dépôt enregistré avant la clarification, pour isoler dans le commit suivant ce que les réponses changent à spec.md"
  before_plan:
    enabled: true
    message: "Spec Kit: état du dépôt enregistré avant la planification, pour isoler dans le commit suivant le plan et ses artefacts de conception"
  before_tasks:
    enabled: true
    message: "Spec Kit: état du dépôt enregistré avant la génération des tâches, pour isoler tasks.md dans le commit suivant"
  before_implement:
    enabled: true
    message: "Spec Kit: état du dépôt enregistré avant l'implémentation, pour séparer les artefacts de conception du code qui les réalise"
  before_checklist:
    enabled: true
    message: "Spec Kit: état du dépôt enregistré avant la liste de vérification, pour l'isoler dans le commit suivant"
  before_analyze:
    enabled: true
    message: "Spec Kit: état du dépôt enregistré avant l'analyse de cohérence, pour isoler dans le commit suivant les corrections qu'elle entraîne"
  before_taskstoissues:
    enabled: true
    message: "Spec Kit: état du dépôt enregistré avant la conversion des tâches en tickets, pour garder tasks.md tel qu'il a été converti"
  after_constitution:
    enabled: true
    message: "Spec Kit: constitution du projet mise à jour, les principes auxquels spécifications, plans et tâches doivent se conformer"
  after_specify:
    enabled: true
    message: "Spec Kit: spécification de la fonctionnalité (spec.md), pour fixer le quoi et le pourquoi avant de planifier le comment"
  after_clarify:
    enabled: true
    message: "Spec Kit: spécification clarifiée, les réponses aux questions ouvertes inscrites dans spec.md avant la planification"
  after_plan:
    enabled: true
    message: "Spec Kit: plan d'implémentation (plan.md et artefacts de conception), pour décider du comment avant de découper en tâches"
  after_tasks:
    enabled: true
    message: "Spec Kit: tâches ordonnées par dépendance (tasks.md), pour implémenter le plan par petites étapes vérifiables"
  after_implement:
    enabled: true
    message: "Spec Kit: avancement de l'implémentation, tâches de tasks.md réalisées et cochées"
  after_checklist:
    enabled: true
    message: "Spec Kit: liste de vérification de la fonctionnalité, pour contrôler la qualité des exigences avant d'implémenter"
  after_analyze:
    enabled: true
    message: "Spec Kit: corrections issues de l'analyse de cohérence entre spec.md, plan.md et tasks.md, avant d'implémenter"
  after_taskstoissues:
    enabled: true
    message: "Spec Kit: tâches converties en tickets, pour suivre leur avancement hors du dépôt"
